<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đấu Trường Danh Vọng - Dự Đoán & Tỉ Số</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #060913; }
    .font-esport { font-family: 'Chakra Petch', sans-serif; }
    .slanted-left { clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); }
    .slanted-right { clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%); }
    @media (max-width: 640px) {
      .slanted-left, .slanted-right { clip-path: none; }
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

  <!-- TOP BANNER (Lấy cảm hứng từ Poster ĐTDV Mùa Đông) -->
  <header class="relative bg-gradient-to-b from-blue-950 via-slate-900 to-[#060913] border-b border-blue-900/40 py-10 px-4 text-center overflow-hidden">
    <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-amber-500 via-blue-500 to-indigo-600"></div>
    <div class="max-w-4xl mx-auto">
      <div class="inline-flex items-center space-x-2 bg-blue-950/80 border border-blue-700/50 px-3 py-1 rounded-full mb-3">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="text-[11px] font-esport font-bold tracking-widest text-amber-400 uppercase">Arena of Glory • Winter</span>
      </div>
      <h1 class="text-3xl sm:text-5xl font-esport font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-blue-300 uppercase drop-shadow-lg">
        KẾT QUẢ THI ĐẤU & DỰ ĐOÁN
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mt-2 font-medium">Cập nhật tỉ số giải đấu & Tranh tài Pick'em bảng xếp hạng</p>

      <!-- Tùy chọn tên người chơi -->
      <div class="mt-5 inline-flex items-center space-x-2 bg-slate-900/90 border border-slate-700/80 px-4 py-1.5 rounded-full">
        <span class="text-xs text-slate-400">Người dự đoán:</span>
        <input id="userNameInput" type="text" value="Fan Liên Quân" onchange="changeUser(this.value)" class="bg-transparent text-amber-400 font-bold text-xs focus:outline-none w-32" />
      </div>
    </div>
  </header>

  <!-- NỘI DUNG CHÍNH -->
  <main class="max-w-3xl mx-auto px-4 mt-6">
    <!-- Tabs -->
    <div class="flex border-b border-slate-800 mb-6 font-esport text-sm font-bold">
      <button onclick="switchTab('matches')" id="tabMatches" class="pb-3 px-5 text-amber-400 border-b-2 border-amber-400 tracking-wider">LỊCH & DỰ ĐOÁN</button>
      <button onclick="switchTab('standings')" id="tabStandings" class="pb-3 px-5 text-slate-400 hover:text-slate-200 tracking-wider">BẢNG XẾP HẠNG</button>
    </div>

    <!-- Danh sách trận đấu -->
    <div id="matchesContainer" class="space-y-4">
      <div class="text-center py-10 text-slate-500 text-sm">Đang tải dữ liệu trận đấu...</div>
    </div>

    <!-- Tab Bảng xếp hạng -->
    <div id="standingsContainer" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-2xl">
      <h3 class="font-esport text-amber-400 font-bold uppercase tracking-wider mb-4 text-base">BẢNG TỔNG SẮP VÒNG BẢNG</h3>
      <div id="standingsList" class="space-y-2.5"></div>
    </div>
  </main>

  <script>
    // === CẤU HÌNH SUPABASE (THAY 2 DÒNG DƯỚI ĐÂY BẰNG KEY CỦA BẠN TỪ BƯỚC 1) ===
    const SUPABASE_URL = "https://wzyfsbyoecrfxkulkrrm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__TLN402YE_M6AC_iiShkTw_tf0sls9d";
    
    // Tự kiểm tra nếu chưa cấu hình thì chạy demo offline
    const isConfigured = !SUPABASE_URL.includes("thay-bang");
    const supabaseClient = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Dữ liệu mẫu (sử dụng ngay khi chưa gắn Supabase)
    const defaultTeams = {
      'ts': { id: 'ts', name: 'Team Secret', short_name: 'TEAM SECRET', logo: 'https://liquipedia.net/commons/images/8/87/Team_Secret_allmode.png', color: '#475569' },
      'fpt': { id: 'fpt', name: 'FPT Flash', short_name: 'FPT FLASH', logo: 'https://liquipedia.net/commons/images/3/36/Team_Flash_2024_allmode.png', color: '#ea580c' },
      '1s': { id: '1s', name: 'One Star Esports', short_name: 'ONE STAR', logo: 'https://liquipedia.net/commons/images/4/47/One_Star_Esports_allmode.png', color: '#dc2626' },
      'rrq': { id: 'rrq', name: 'Rex Regum Qeon', short_name: 'RRQ', logo: 'https://liquipedia.net/commons/images/6/67/Rex_Regum_Qeon_allmode.png', color: '#ca8a04' },
      'sgp': { id: 'sgp', name: 'Saigon Phantom', short_name: 'SGP', logo: 'https://liquipedia.net/commons/images/d/d7/Saigon_Phantom_2023_allmode.png', color: '#eab308' },
      'tdt': { id: 'tdt', name: 'The DareDevil Team', short_name: 'TDT', logo: 'https://liquipedia.net/commons/images/2/29/The_DareDevil_Team_allmode.png', color: '#7c3aed' }
    };

    let matchesData = [
      { id: 'm1', round: 'VÒNG BẢNG - LƯỢT ĐI', t1: 'ts', t2: 'fpt', s1: 1, s2: 3, date: '30/08', status: 'completed' },
      { id: 'm2', round: 'VÒNG BẢNG - LƯỢT ĐI', t1: '1s', t2: 'rrq', s1: 3, s2: 1, date: '30/08', status: 'completed' },
      { id: 'm3', round: 'VÒNG BẢNG - LƯỢT ĐI', t1: 'sgp', t2: 'tdt', s1: 3, s2: 2, date: '30/08', status: 'completed' },
      { id: 'm4', round: 'VÒNG BẢNG - LƯỢT ĐI', t1: 'sgp', t2: 'fpt', s1: null, s2: null, date: '05/09', status: 'upcoming' }
    ];

    let predictions = JSON.parse(localStorage.getItem('my_predictions') || '{}');
    let currentUser = localStorage.getItem('pickem_user') || 'Fan Liên Quân';
    document.getElementById('userNameInput').value = currentUser;

    function changeUser(val) {
      currentUser = val;
      localStorage.setItem('pickem_user', val);
      loadData();
    }

    async function loadData() {
      // Nếu có cấu hình Supabase thật, lấy từ server
      if (supabaseClient) {
        try {
          const { data: dbMatches } = await supabaseClient.from('matches').select('*');
          if (dbMatches && dbMatches.length > 0) {
            matchesData = dbMatches.map(m => ({
              id: m.id, round: m.round_name, t1: m.team1_id, t2: m.team2_id,
              s1: m.score_team1, s2: m.score_team2, date: m.match_date, status: m.status
            }));
          }
          const { data: dbPreds } = await supabaseClient.from('predictions').select('*').eq('user_name', currentUser);
          if (dbPreds) {
            dbPreds.forEach(p => { predictions[p.match_id] = { winner: p.winner_id, s1: p.score_1, s2: p.score_2 }; });
          }
        } catch(e) { console.warn("Dùng chế độ local", e); }
      }
      renderMatches();
      renderStandings();
    }

    function renderMatches() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = matchesData.map(m => {
        const t1 = defaultTeams[m.t1] || { short_name: m.t1, color: '#334155', logo: '' };
        const t2 = defaultTeams[m.t2] || { short_name: m.t2, color: '#1e293b', logo: '' };
        const pred = predictions[m.id];
        const isDone = m.status === 'completed';

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <!-- Header bar -->
            <div class="flex justify-between items-center px-4 py-2 bg-slate-950/90 text-xs font-esport tracking-widest text-slate-400 border-b border-slate-800/80">
              <span class="text-amber-400 font-bold">${m.round}</span>
              <span>NGÀY ${m.date}</span>
            </div>

            <!-- Match Clash Banner (Slanted Cut) -->
            <div class="grid grid-cols-12 h-20 sm:h-24 relative overflow-hidden bg-slate-950">
              <!-- Đội 1 -->
              <div onclick="makePrediction('${m.id}', '${m.t1}', 3, 1, ${isDone})" 
                   style="background-color: ${t1.color};" 
                   class="col-span-5 slanted-left flex items-center justify-between px-4 cursor-pointer hover:brightness-110 transition-all select-none">
                <div class="flex items-center space-x-3">
                  <img src="${t1.logo}" class="w-8 h-8 sm:w-10 sm:h-10 object-contain drop-shadow-md">
                  <span class="text-white font-esport font-extrabold text-sm sm:text-base">${t1.short_name}</span>
                </div>
              </div>

              <!-- Tỉ số ở giữa -->
              <div class="col-span-2 flex flex-col items-center justify-center bg-slate-950 z-10">
                ${isDone ? `
                  <div class="font-esport font-black text-2xl sm:text-3xl flex items-center space-x-1.5">
                    <span class="${m.s1 > m.s2 ? 'text-amber-400' : 'text-slate-400'}">${m.s1}</span>
                    <span class="text-slate-600 text-sm">:</span>
                    <span class="${m.s2 > m.s1 ? 'text-amber-400' : 'text-slate-400'}">${m.s2}</span>
                  </div>
                ` : `
                  <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-black">VS</span>
                `}
              </div>

              <!-- Đội 2 -->
              <div onclick="makePrediction('${m.id}', '${m.t2}', 1, 3, ${isDone})" 
                   style="background-color: ${t2.color};" 
                   class="col-span-5 slanted-right flex items-center justify-between flex-row-reverse px-4 cursor-pointer hover:brightness-110 transition-all select-none">
                <div class="flex items-center flex-row-reverse space-x-reverse space-x-3">
                  <img src="${t2.logo}" class="w-8 h-8 sm:w-10 sm:h-10 object-contain drop-shadow-md">
                  <span class="text-white font-esport font-extrabold text-sm sm:text-base">${t2.short_name}</span>
                </div>
              </div>
            </div>

            <!-- Thanh dự đoán bên dưới -->
            <div class="px-4 py-2 bg-slate-950/70 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <div class="flex items-center space-x-2">
                <span class="text-slate-400">Bạn chọn:</span>
                ${pred ? `
                  <span class="text-amber-400 font-bold bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20 font-esport">
                    ${defaultTeams[pred.winner]?.short_name} thắng (${pred.s1} - ${pred.s2})
                  </span>
                ` : `
                  <span class="text-slate-500 italic">Bấm vào đội để dự đoán</span>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function makePrediction(matchId, winnerId, s1, s2, isDone) {
      if (isDone) return; // Trận đấu đã xong không cho sửa
      predictions[matchId] = { winner: winnerId, s1, s2 };
      localStorage.setItem('my_predictions', JSON.stringify(predictions));
      renderMatches();

      // Lưu lên Supabase nếu có
      if (supabaseClient) {
        await supabaseClient.from('predictions').upsert({
          user_name: currentUser,
          match_id: matchId,
          winner_id: winnerId,
          score_1: s1,
          score_2: s2
        }, { onConflict: 'user_name,match_id' });
      }
    }

    function renderStandings() {
      const container = document.getElementById('standingsList');
      container.innerHTML = Object.values(defaultTeams).map((team, idx) => `
        <div class="flex items-center justify-between p-3 bg-slate-950/60 rounded-lg border border-slate-800">
          <div class="flex items-center space-x-3">
            <span class="font-esport font-bold text-slate-500 w-4">${idx + 1}</span>
            <img src="${team.logo}" class="w-6 h-6 object-contain">
            <span class="font-bold text-sm text-slate-200">${team.name}</span>
          </div>
          <span class="font-esport text-xs font-extrabold px-2.5 py-1 rounded bg-slate-800 text-amber-400">${team.short_name}</span>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('matchesContainer').classList.toggle('hidden', tab !== 'matches');
      document.getElementById('standingsContainer').classList.toggle('hidden', tab !== 'standings');
      document.getElementById('tabMatches').className = tab === 'matches' 
        ? 'pb-3 px-5 text-amber-400 border-b-2 border-amber-400 tracking-wider' 
        : 'pb-3 px-5 text-slate-400 hover:text-slate-200 tracking-wider';
      document.getElementById('tabStandings').className = tab === 'standings' 
        ? 'pb-3 px-5 text-amber-400 border-b-2 border-amber-400 tracking-wider' 
        : 'pb-3 px-5 text-slate-400 hover:text-slate-200 tracking-wider';
    }

    loadData();
  </script>
</body>
</html>
