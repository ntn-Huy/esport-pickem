name: Sync Liquipedia Real

on:
  schedule:
    - cron: '0 */4 * * *' # Tự động chạy mỗi 4 tiếng
  workflow_dispatch:      # Nút bấm thủ công

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt thư viện
        run: npm install @supabase/supabase-js ws

      - name: Đồng bộ tỉ số từ Liquipedia
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node - << 'EOF'
          const { createClient } = require('@supabase/supabase-js');

          const PAGE_TITLE = "Arena_of_Glory/2026/Winter/Group_Stage";
          const LIQUIPEDIA_API = `https://liquipedia.net/honorofkings/api.php?action=parse&page=${encodeURIComponent(PAGE_TITLE)}&prop=wikitext&format=json`;

          async function run() {
            const url = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_ANON_KEY;

            console.log("=== BẮT ĐẦU QUÁ TRÌNH ĐỒNG BỘ ===");

            if (!url || !key) {
              console.error("❌ LỖI: Chưa tìm thấy VITE_SUPABASE_URL hoặc VITE_SUPABASE_ANON_KEY trong Secrets.");
              process.exit(1);
            }

            // Khởi tạo Supabase client và tắt realtime socket để không bị lỗi kết nối
            const supabase = createClient(url, key, {
              auth: { persistSession: false },
              realtime: { createSocket: () => null }
            });

            console.log("✔ Kết nối Supabase thành công. Đang tải trang giải đấu...");

            const res = await fetch(LIQUIPEDIA_API, {
              headers: {
                "User-Agent": "AOGEsportScraper/3.0 (contact: admin@esport-hub.org)",
                "Accept-Encoding": "gzip"
              }
            });

            if (!res.ok) {
              console.error(`❌ Liquipedia phản hồi HTTP ${res.status}`);
              return;
            }

            const json = await res.json();
            const text = json.parse?.wikitext?.["*"] || "";

            if (!text) {
              console.log("⚠ Trang Liquipedia không có nội dung wikitext.");
              return;
            }

            console.log("✔ Tải dữ liệu giải đấu thành công. Đang phân tích kết quả...");

            // Bắt cặp đấu và kết quả tỉ số
            const regex = /team1=([^\n|]+)[\s\S]*?team2=([^\n|]+)[\s\S]*?games1=(\d+)[\s\S]*?games2=(\d+)/gi;
            let match;
            let count = 0;

            while ((match = regex.exec(text)) !== null) {
              const [, t1, t2, g1, g2] = match;
              const s1 = parseInt(g1, 10);
              const s2 = parseInt(g2, 10);
              const team1 = t1.trim().toLowerCase();
              const team2 = t2.trim().toLowerCase();

              console.log(`🔎 [${t1.trim()}] ${s1} - ${s2} [${t2.trim()}]`);

              if (s1 > 0 || s2 > 0) {
                // Cập nhật kết quả vào Supabase
                const { error } = await supabase
                  .from('matches')
                  .update({
                    score_team1: s1,
                    score_team2: s2,
                    status: 'completed'
                  })
                  .or(`and(team1_id.eq.${team1},team2_id.eq.${team2}),and(team1_id.eq.${team2},team2_id.eq.${team1})`);

                if (error) {
                  console.warn(`  ↳ Cảnh báo: ${error.message}`);
                } else {
                  count++;
                }
              }
            }

            console.log(`\n🎉 HOÀN TẤT! Đã đồng bộ tỉ số ${count} trận đấu vào cơ sở dữ liệu.`);
          }

          run().catch(err => {
            console.error("Lỗi:", err.message);
            process.exit(1);
          });
          EOF
